<!-- ── Drawer overlay ── -->
<div class="drawer-overlay" [class.open]="drawerOpen" (click)="closeDrawer()"></div>

<!-- ── Drawer lateral ── -->
<aside class="drawer" [class.open]="drawerOpen">

  <div class="drawer-header">
    <div class="drawer-title-group">
      <p class="label-mono">Portafolio</p>
      <h2 class="drawer-title">Otros<br><em>proyectos</em></h2>
    </div>
    <button class="drawer-close" (click)="closeDrawer()" aria-label="Cerrar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M18 6L6 18M6 6l12 12" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <div class="drawer-rule"></div>

  <div class="drawer-projects">
    <a
      class="project-card"
      *ngFor="let p of projects"
      [routerLink]="['/project', p.id]"
      (click)="closeDrawer()"
    >
      <div class="project-card__top" [style.background]="p.color + '18'">
        <div class="project-card__icon" [style.background]="p.color + '18'">
          <img [src]="p.imageUrl" [alt]="p.name" loading="lazy">
        </div>
        <span class="project-card__tag" [style.color]="p.color">{{ p.tag }}</span>
      </div>
      <div class="project-card__body">
        <h3 class="project-card__name">{{ p.name }}</h3>
        <p class="project-card__desc">{{ p.shortDesc }}</p>
      </div>
      <div class="project-card__arrow">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M4 10h12M10 4l6 6-6 6" stroke-linecap="round"/>
        </svg>
      </div>
    </a>
  </div>

  <div class="drawer-footer">
    <p class="label-mono">gambalocal.es</p>
  </div>

</aside>
